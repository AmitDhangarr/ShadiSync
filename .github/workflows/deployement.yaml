name: "Continuos Integration and Deployment"

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Changes
        uses: actions/checkout@v4

      - name: Deployment using SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PORT: ${{ secrets.PORT }}
          MONGODBURL: ${{ secrets.MONGODBURL }}
          SECRET: ${{ secrets.SECRET }}
        with:
          host: ${{ secrets.SSH_HOST_2 }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY_2 }}
          port: 22
          envs: PORT,MONGODBURL,SECRET
          script: |
            set -e

            sudo apt update

            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo usermod -aG docker ubuntu
            fi

            if [ ! -d "/home/ubuntu/ShadiSync/.git" ]; then
              git clone https://github.com/AmitDhangarr/ShadiSync.git /home/ubuntu/ShadiSync
            fi

            cd /home/ubuntu/ShadiSync
            git fetch origin
            git reset --hard origin/main

            cat <<EOF > .env
            PORT=$PORT
            MONGODBURL=$MONGODBURL
            SECRET=$SECRET
            EOF

            sudo docker compose up -d --build